[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liveguard-quality-ops"
version = "1.0.0"
description = "Synthetic moderation quality operations and model evaluation portfolio project"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.38,<2",
  "plotly>=5.24,<7",
  "tabulate>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

